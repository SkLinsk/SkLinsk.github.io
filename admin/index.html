<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex"><title>写作 · SkLinsk</title><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/site.css"><link rel="stylesheet" href="/notes/sqp/assets/katex/katex.min.css"><link rel="stylesheet" href="writer.css"></head><body><a class="skip" href="#editor">跳到编辑器</a><div class="writer-shell"><header class="site-header"><a class="brand" href="/">SkLinsk / 写作</a><div class="header-actions"><div class="theme-switch" role="group" aria-label="外观模式"><button data-mode="light" aria-label="白色模式">白</button><button data-mode="dark" aria-label="黑色模式">黑</button><button data-mode="system" aria-label="跟随系统">自动</button></div><button id="login">GitHub 登录</button><button id="logout" hidden>退出</button></div></header><p id="status" role="status">正在载入写作后台…</p><details id="setup"><summary>首次配置 GitHub 登录</summary><p>授权服务尚未连接时，仍可保存本机草稿和预览。<a href="setup.html">查看配置步骤</a></p><label>你的授权服务网址 <input id="auth-url" type="url" placeholder="https://你的服务.workers.dev"></label><button id="save-auth">保存服务网址</button></details><div class="workspace"><aside><div class="aside-head"><h2>文章</h2><button id="new">新建</button></div><p class="muted">草稿只保存在当前浏览器，不会上传到公开仓库。</p><div id="drafts"></div><h3>已发布</h3><button id="refresh">刷新列表</button><div id="articles"></div></aside><main id="editor"><div class="metadata"><label>标题<input id="title" maxlength="180" placeholder="文章标题"></label><div class="pair"><label>分类<input id="category" maxlength="80" placeholder="例如：数值线性代数"></label><label>网址名称<input id="slug" pattern="[a-z0-9-]+" placeholder="例如：my-first-note"></label></div><label>摘要<textarea id="summary" rows="2" maxlength="300" placeholder="在首页展示的简短介绍"></textarea></label></div><div class="toolbar"><button id="save">保存本机草稿</button><button id="export">导出 Markdown</button><label class="file-button">插入图片<input id="image" type="file" accept="image/png,image/jpeg,image/webp" hidden></label><button id="publish" class="primary">发布文章</button></div><p id="saved" class="muted">未保存</p><div class="writing"><label>Markdown 正文<textarea id="body" spellcheck="false" placeholder="# 标题&#10;&#10;写下正文。行内公式：$Au=b$&#10;&#10;独立公式：&#10;$$&#10;A=A^T\succ0&#10;$$"></textarea></label><section aria-label="文章预览"><h2>预览</h2><div class="prose" id="preview"></div></section></div><p class="muted">发布会同步生成网页并更新首页与归档。原有文章的交互演示会保留；修改正文后不再显示可能过时的 PDF 下载入口。</p></main></div></div><script src="vendor/marked.js"></script><script src="vendor/katex.js"></script><script src="core.js"></script><script src="writer.js"></script></body></html>
